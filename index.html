<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Compteur Premium</title>
    <style>
        body {
            font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 1rem 0;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Taches lumineuses violet / bleu qui bougent sur fond noir */
        body::before,
        body::after,
        html::before {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            z-index: -1;
        }

        body::before {
            width: 55vmax;
            height: 55vmax;
            top: -15%;
            left: -10%;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.55), transparent 65%);
            animation: deriveViolet 18s ease-in-out infinite alternate;
        }

        body::after {
            width: 50vmax;
            height: 50vmax;
            bottom: -15%;
            right: -10%;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.5), transparent 65%);
            animation: deriveBleu 22s ease-in-out infinite alternate;
        }

        html::before {
            width: 35vmax;
            height: 35vmax;
            top: 40%;
            left: 35%;
            background: radial-gradient(circle, rgba(79, 70, 229, 0.4), transparent 65%);
            animation: deriveIndigo 26s ease-in-out infinite alternate;
        }

        @keyframes deriveViolet {
            0%   { transform: translate(0, 0) scale(1); }
            50%  { transform: translate(30vw, 20vh) scale(1.2); }
            100% { transform: translate(10vw, 50vh) scale(0.9); }
        }

        @keyframes deriveBleu {
            0%   { transform: translate(0, 0) scale(1); }
            50%  { transform: translate(-30vw, -25vh) scale(1.15); }
            100% { transform: translate(-10vw, -50vh) scale(0.9); }
        }

        @keyframes deriveIndigo {
            0%   { transform: translate(0, 0) scale(1); }
            50%  { transform: translate(-25vw, 20vh) scale(1.3); }
            100% { transform: translate(25vw, -30vh) scale(0.9); }
        }

        .counter-container {
            background: rgba(10, 10, 18, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 2.5rem 2rem;
            border-radius: 24px;
            border: 1px solid rgba(139, 92, 246, 0.35);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(99, 102, 241, 0.15);
            text-align: center;
            max-width: 420px;
            width: 90%;
            transition: transform 0.3s ease;
        }

        .counter-container:hover {
            transform: translateY(-5px);
        }

        h1 {
            color: #ffffff;
            font-size: 2.2rem;
            margin: 0 0 0.5rem 0;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #b4b4c7;
            font-size: 0.95rem;
            margin: 0 0 1.2rem 0;
            min-height: 1.3em;
        }

        /* Menus */
        .menus {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 1rem;
        }

        .menu {
            flex: 1;
            text-align: left;
        }

        .menu label {
            display: block;
            color: #b4b4c7;
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 0.3rem;
        }

        .menu select {
            width: 100%;
            padding: 0.7rem 0.8rem;
            font-size: 0.95rem;
            font-family: inherit;
            font-weight: 600;
            color: #ffffff;
            color-scheme: dark;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(139, 92, 246, 0.5);
            border-radius: 12px;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .menu select:focus,
        .menu select:hover {
            border-color: #8b5cf6;
        }

        .menu select option {
            background: #111118;
            color: #ffffff;
        }

        /* Bandeau chrono + record */
        .infos {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 0.5rem;
        }

        .info-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 14px;
            padding: 0.6rem 0.4rem;
        }

        .info-box .titre {
            display: block;
            font-size: 0.75rem;
            color: #b4b4c7;
            font-weight: 500;
        }

        .info-box .valeur {
            display: block;
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
        }

        .info-box .valeur.urgent {
            color: #e11d48;
        }

        .number {
            font-size: 5.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #c4b5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0.8rem 0;
            font-variant-numeric: tabular-nums;
            transition: transform 0.05s ease;
        }

        .btn {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: none;
            padding: 1.2rem 2.5rem;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.3);
            transition: all 0.2s ease;
            outline: none;
        }

        /* Grande zone de clic pour la souris */
        #bouton-clic {
            min-height: 180px;
            padding: 3rem 2rem;
            font-size: 1.8rem;
            border-radius: 20px;
        }

        .btn:hover {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            box-shadow: 0 12px 24px rgba(79, 70, 229, 0.4);
            transform: scale(1.02);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn.desactive {
            background: linear-gradient(135deg, #a1a1aa 0%, #71717a 100%);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .btn-reset {
            background: transparent;
            color: #b4b4c7;
            box-shadow: none;
            padding: 0.8rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 500;
            margin-top: 1rem;
            border-radius: 10px;
            width: auto;
            display: inline-block;
        }

        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            box-shadow: none;
            transform: none;
        }

        /* Résultat avec étoiles et animal */
        .resultat {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 0.8rem;
            margin-bottom: 1rem;
            animation: apparition 0.5s ease;
        }

        .resultat-animal {
            font-size: 4.5rem;
            line-height: 1.1;
        }

        .resultat-etoiles {
            font-size: 1.8rem;
            color: #f59e0b;
            letter-spacing: 4px;
        }

        .resultat-nom {
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
        }

        @keyframes apparition {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Ondes violettes au clic */
        .onde {
            position: fixed;
            width: 20px;
            height: 20px;
            margin: -10px 0 0 -10px;
            border-radius: 50%;
            border: 3px solid rgba(167, 139, 250, 0.9);
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.8), inset 0 0 12px rgba(139, 92, 246, 0.5);
            pointer-events: none;
            z-index: 50;
            animation: onde 0.7s ease-out forwards;
        }

        @keyframes onde {
            from { transform: scale(0.2); opacity: 0.95; }
            to { transform: scale(5); opacity: 0; }
        }

        /* Mini confettis de fin de partie */
        .confetti {
            position: fixed;
            top: -12px;
            width: 6px;
            height: 10px;
            border-radius: 2px;
            pointer-events: none;
            z-index: 60;
            animation: chute linear forwards;
        }

        @keyframes chute {
            to { transform: translate(var(--dx), 105vh) rotate(var(--rot)); }
        }

        /* Menu déroulant à gauche : test de réaction */
        .menu-gauche {
            position: fixed;
            left: 16px;
            top: 24px;
            width: 250px;
            z-index: 40;
        }

        .menu-gauche-bouton {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 1rem;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            background: rgba(10, 10, 18, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(139, 92, 246, 0.35);
            border-radius: 14px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .menu-gauche-bouton:hover,
        .menu-gauche-bouton:focus-visible {
            border-color: #8b5cf6;
        }

        .menu-gauche .fleche {
            transition: transform 0.2s ease;
        }

        .menu-gauche.ouvert .fleche {
            transform: rotate(180deg);
        }

        .menu-gauche-contenu {
            margin-top: 0.5rem;
            padding: 0.8rem;
            background: rgba(10, 10, 18, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(139, 92, 246, 0.35);
            border-radius: 14px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        .zone-reaction {
            height: 150px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0.5rem;
            margin-bottom: 0.6rem;
            color: #ffffff;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .zone-reaction.attente  { background: #312e81; }
        .zone-reaction.rouge    { background: #dc2626; }
        .zone-reaction.vert     { background: #16a34a; }
        .zone-reaction.trop-tot { background: #9a3412; }
        .zone-reaction.resultat { background: #4f46e5; }

        .reac-titre {
            font-size: 1.4rem;
            font-weight: 800;
        }

        .reac-sous {
            font-size: 0.75rem;
            opacity: 0.85;
            margin-top: 0.3rem;
        }

        .menu-gauche .infos {
            margin-bottom: 0;
        }

        .menu-gauche .info-box .valeur {
            font-size: 1.15rem;
        }

        @media (max-width: 960px) {
            .menu-gauche {
                top: auto;
                bottom: 16px;
                width: 220px;
                display: flex;
                flex-direction: column-reverse;
            }

            .menu-gauche-contenu {
                margin-top: 0;
                margin-bottom: 0.5rem;
            }
        }

        .bump {
            transform: scale(1.1);
        }

        .record-flash {
            animation: flash 0.8s ease 3;
        }

        @keyframes flash {
            50% { transform: scale(1.12); }
        }
    </style>
</head>
<body>

    <!-- Menu déroulant à gauche : test de réaction -->
    <div class="menu-gauche" id="menu-gauche">
        <button class="menu-gauche-bouton" id="menu-gauche-bouton" aria-expanded="false">
            <span>⚡ Test de réaction</span>
            <span class="fleche">▾</span>
        </button>
        <div class="menu-gauche-contenu" id="menu-gauche-contenu" style="display:none">
            <div class="zone-reaction attente" id="zone-reaction">
                <div class="reac-titre" id="reac-titre">Clique pour commencer</div>
                <div class="reac-sous" id="reac-sous">Clique dès que la zone devient verte !</div>
            </div>
            <div class="infos">
                <div class="info-box">
                    <span class="titre">Dernier</span>
                    <span class="valeur" id="reac-dernier">-</span>
                </div>
                <div class="info-box">
                    <span class="titre">🏆 Meilleur</span>
                    <span class="valeur" id="reac-record">-</span>
                </div>
            </div>
        </div>
    </div>

    <div class="counter-container">
        <h1>Mon Compteur</h1>
        <p class="subtitle" id="sous-titre"></p>

        <div class="menus">
            <div class="menu">
                <label for="menu-mode">Mode de clic</label>
                <select id="menu-mode">
                    <option value="souris">🖱️ Souris</option>
                    <option value="clavier">⌨️ Clavier</option>
                </select>
            </div>
            <div class="menu">
                <label for="menu-chrono">Chrono</label>
                <select id="menu-chrono">
                    <option value="oui" selected>⏱️ Activé</option>
                    <option value="non">♾️ Désactivé</option>
                </select>
            </div>
        </div>

        <div class="menus" id="ligne-duree">
            <div class="menu">
                <label for="menu-duree">Durée du chrono</label>
                <select id="menu-duree">
                    <option value="1">1 seconde</option>
                    <option value="5">5 secondes</option>
                    <option value="10">10 secondes</option>
                    <option value="15">15 secondes</option>
                    <option value="30" selected>30 secondes</option>
                    <option value="60">60 secondes</option>
                </select>
            </div>
        </div>

        <div class="infos" id="bloc-infos">
            <div class="info-box">
                <span class="titre">⏱️ Temps restant</span>
                <span class="valeur" id="affichage-temps">30.0</span>
            </div>
            <div class="info-box" id="boite-record">
                <span class="titre">🏆 Meilleur score</span>
                <span class="valeur" id="affichage-record">0</span>
            </div>
        </div>

        <div class="number" id="affichage-compteur">0</div>

        <!-- Résultat final (uniquement pour le chrono de 5 secondes) -->
        <div class="resultat" id="resultat" style="display:none">
            <div class="resultat-animal" id="resultat-animal"></div>
            <div class="resultat-etoiles" id="resultat-etoiles"></div>
            <div class="resultat-nom" id="resultat-nom"></div>
        </div>

        <button class="btn" id="bouton-clic">Cliquez ici</button>
        <button class="btn btn-reset" id="bouton-reset">Réinitialiser</button>
    </div>

    <script>
        // ----- État du jeu -----
        let nombreDeClics = 0;
        let mode = 'souris';          // 'souris' ou 'clavier'
        let duree = 30;               // en secondes
        let chronoActif = true;       // true = avec chrono, false = mode libre
        let etat = 'attente';         // 'attente' | 'enCours' | 'fini'
        let finDuJeu = 0;             // timestamp de fin
        let intervalle = null;

        // ----- Détection d'autoclicker (réglages) -----
        const MAX_CLICS_PAR_SEC = 22;     // au-delà de 22 clics dans la même seconde : suspect
        const NB_INTERVALLES = 20;        // nombre de clics analysés pour la régularité
        const SEUIL_REGULARITE = 0.05;    // plus c'est petit, plus il faut un rythme "robotique" pour être détecté
        let tempsClics = [];              // moments des derniers clics

        // ----- Éléments -----
        const affichage = document.getElementById('affichage-compteur');
        const boutonClic = document.getElementById('bouton-clic');
        const boutonReset = document.getElementById('bouton-reset');
        const menuMode = document.getElementById('menu-mode');
        const menuDuree = document.getElementById('menu-duree');
        const menuChrono = document.getElementById('menu-chrono');
        const ligneDuree = document.getElementById('ligne-duree');
        const blocInfos = document.getElementById('bloc-infos');
        const sousTitre = document.getElementById('sous-titre');
        const affichageTemps = document.getElementById('affichage-temps');
        const affichageRecord = document.getElementById('affichage-record');
        const boiteRecord = document.getElementById('boite-record');

        // ----- Meilleur score (un record par durée, sauvegardé dans le navigateur) -----
        function lireRecord(d) {
            try {
                return parseInt(localStorage.getItem('compteur-record-' + d), 10) || 0;
            } catch (e) {
                return 0;
            }
        }

        function ecrireRecord(d, score) {
            try {
                localStorage.setItem('compteur-record-' + d, String(score));
            } catch (e) {
                // stockage indisponible : le record ne sera pas gardé après fermeture
            }
        }

        function afficherRecord() {
            affichageRecord.textContent = lireRecord(duree);
        }

        // ----- Affichage -----
        function afficherTemps(secondes) {
            affichageTemps.textContent = secondes.toFixed(1);
            affichageTemps.classList.toggle('urgent', etat === 'enCours' && secondes <= 5);
        }

        function messageAttente() {
            if (!chronoActif) {
                sousTitre.textContent = 'Mode libre : clique autant que tu veux, sans limite de temps !';
            } else if (mode === 'souris') {
                sousTitre.textContent = 'Le chrono démarre au premier clic !';
            } else {
                sousTitre.textContent = 'Le chrono démarre à la première pression (Espace, Entrée ou ↑) !';
            }
        }

        function appliquerMode() {
            if (mode === 'souris') {
                boutonClic.textContent = 'Cliquez ici';
                boutonClic.classList.remove('desactive');
            } else {
                boutonClic.textContent = 'Appuyez sur Espace / Entrée / ↑';
                boutonClic.classList.add('desactive');
            }
            if (etat === 'attente') messageAttente();
        }

        // ----- Logique du jeu -----
        function demarrer() {
            etat = 'enCours';
            sousTitre.textContent = 'Go ! Clique le plus vite possible !';
            finDuJeu = performance.now() + duree * 1000;
            intervalle = setInterval(tick, 50);
        }

        function tick() {
            const restant = (finDuJeu - performance.now()) / 1000;
            if (restant <= 0) {
                terminer();
            } else {
                afficherTemps(restant);
            }
        }

        function terminer() {
            clearInterval(intervalle);
            intervalle = null;
            etat = 'fini';
            afficherTemps(0);

            const ancienRecord = lireRecord(duree);
            if (nombreDeClics > ancienRecord) {
                ecrireRecord(duree, nombreDeClics);
                afficherRecord();
                sousTitre.textContent = '🎉 Nouveau record : ' + nombreDeClics + ' clics en ' + duree + ' s !';
                boiteRecord.classList.remove('record-flash');
                void boiteRecord.offsetWidth; // relance l'animation
                boiteRecord.classList.add('record-flash');
            } else {
                sousTitre.textContent = '⏱️ Temps écoulé ! Score : ' + nombreDeClics + ' (record : ' + ancienRecord + ')';
            }

            afficherNote(nombreDeClics);
            lancerConfettis();
        }

        // Note finale (étoiles + animal) pour le chrono de 5 secondes
        function afficherNote(score) {
            let etoiles, animal, nom;

            // Seuils par durée (en clics) : [1 étoile, 2 étoiles, 3 étoiles, 4 étoiles, 5 étoiles]
            const tableSeuils = {
                1:  [5, 6, 7, 8, 10],
                5:  [20, 25, 30, 35, 45],
                10: [40, 50, 55, 65, 85],
                15: [55, 70, 80, 95, 120],
                30: [100, 130, 155, 180, 230],
                60: [190, 240, 290, 335, 430]
            };
            const s = tableSeuils[duree];

            if (score >= s[4])      { etoiles = 5; animal = '🦅'; nom = 'Faucon'; }
            else if (score >= s[3]) { etoiles = 4; animal = '🐆'; nom = 'Léopard'; }
            else if (score >= s[2]) { etoiles = 3; animal = '🐇'; nom = 'Lapin'; }
            else if (score >= s[1]) { etoiles = 2; animal = '🐌'; nom = 'Escargot'; }
            else if (score >= s[0]) { etoiles = 1; animal = '🐢'; nom = 'Tortue'; }
            else                    { etoiles = 0; animal = '🐨'; nom = 'Koala'; }

            document.getElementById('resultat-animal').textContent = animal;
            document.getElementById('resultat-etoiles').textContent = '★'.repeat(etoiles) + '☆'.repeat(5 - etoiles);
            document.getElementById('resultat-nom').textContent = nom + ' — ' + etoiles + ' étoile' + (etoiles > 1 ? 's' : '');
            document.getElementById('resultat').style.display = '';
        }

        function reinitialiser() {
            clearInterval(intervalle);
            intervalle = null;
            etat = 'attente';
            tempsClics = [];
            nombreDeClics = 0;
            affichage.textContent = 0;
            afficherTemps(duree);
            afficherRecord();
            boiteRecord.classList.remove('record-flash');
            document.getElementById('resultat').style.display = 'none';
            messageAttente();
        }

        // Détection d'autoclicker : renvoie true si le clic paraît automatique
        function estTriche(estTruste) {
            // 1) Clic généré par un script (pas par une vraie souris / un vrai clavier)
            if (estTruste === false) return true;

            const maintenant = performance.now();
            tempsClics.push(maintenant);
            if (tempsClics.length > 40) tempsClics.shift();

            // 2) Trop de clics dans la dernière seconde
            let dansLaSeconde = 0;
            for (let i = tempsClics.length - 1; i >= 0; i--) {
                if (maintenant - tempsClics[i] <= 1000) {
                    dansLaSeconde++;
                } else {
                    break;
                }
            }
            if (dansLaSeconde > MAX_CLICS_PAR_SEC) return true;

            // 3) Rythme trop régulier (un humain n'est jamais parfaitement régulier)
            if (tempsClics.length > NB_INTERVALLES) {
                const derniers = tempsClics.slice(-(NB_INTERVALLES + 1));
                const intervalles = [];
                for (let i = 1; i < derniers.length; i++) {
                    intervalles.push(derniers[i] - derniers[i - 1]);
                }
                const moyenne = intervalles.reduce((a, b) => a + b, 0) / intervalles.length;
                const variance = intervalles.reduce((a, b) => a + (b - moyenne) * (b - moyenne), 0) / intervalles.length;
                const ecartType = Math.sqrt(variance);
                if (moyenne < 300 && ecartType / moyenne < SEUIL_REGULARITE) return true;
            }

            return false;
        }

        // Autoclicker détecté : on arrête tout et on annule la partie
        function declarerTriche() {
            clearInterval(intervalle);
            intervalle = null;
            etat = 'triche';
            tempsClics = [];
            nombreDeClics = 0;
            affichage.textContent = 0;
            affichageTemps.textContent = '--';
            affichageTemps.classList.remove('urgent');
            document.getElementById('resultat').style.display = 'none';
            sousTitre.textContent = '🚫 Autoclicker détecté : partie annulée, score non enregistré. Clique sur Réinitialiser pour rejouer.';
        }

        // Mini confettis qui tombent à la fin du chrono
        function lancerConfettis() {
            const couleurs = ['#8b5cf6', '#a78bfa', '#c4b5fd', '#6366f1', '#3b82f6', '#60a5fa', '#ffffff', '#f472b6'];
            for (let i = 0; i < 60; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.background = couleurs[Math.floor(Math.random() * couleurs.length)];
                c.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
                c.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
                c.style.animationDuration = (1.8 + Math.random() * 1.4) + 's';
                c.style.animationDelay = (Math.random() * 0.4) + 's';
                c.addEventListener('animationend', () => c.remove());
                document.body.appendChild(c);
            }
        }

        // Onde violette : à l'endroit du clic (souris) ou au centre du bouton (clavier)
        function creerOnde(x, y) {
            if (x === undefined || y === undefined) {
                const r = boutonClic.getBoundingClientRect();
                x = r.left + r.width / 2;
                y = r.top + r.height / 2;
            }
            // Deux ondes décalées pour un effet plus joli
            [0, 0.12].forEach((delai) => {
                const onde = document.createElement('div');
                onde.className = 'onde';
                onde.style.left = x + 'px';
                onde.style.top = y + 'px';
                onde.style.animationDelay = delai + 's';
                onde.addEventListener('animationend', () => onde.remove());
                document.body.appendChild(onde);
            });
        }

        function incrementer(x, y, estTruste) {
            if (etat === 'fini' || etat === 'triche') return;   // plus de clics après la fin ou après une triche
            if (estTriche(estTruste)) {
                declarerTriche();
                return;
            }
            creerOnde(x, y);
            if (etat === 'attente' && chronoActif) demarrer(); // le premier clic lance le chrono (si activé)

            nombreDeClics = nombreDeClics + 1;
            affichage.textContent = nombreDeClics;

            affichage.classList.add('bump');
            setTimeout(() => {
                affichage.classList.remove('bump');
            }, 50);
        }

        // ----- Événements -----
        menuMode.addEventListener('change', () => {
            mode = menuMode.value;
            appliquerMode();
            menuMode.blur();
        });

        menuChrono.addEventListener('change', () => {
            chronoActif = (menuChrono.value === 'oui');
            // En mode libre, on cache la durée, le temps et le record
            ligneDuree.style.display = chronoActif ? '' : 'none';
            blocInfos.style.display = chronoActif ? '' : 'none';
            reinitialiser();
            menuChrono.blur();
        });

        menuDuree.addEventListener('change', () => {
            duree = parseInt(menuDuree.value, 10);
            reinitialiser();   // changer la durée relance une nouvelle partie
            menuDuree.blur();
        });

        boutonClic.addEventListener('click', (e) => {
            if (mode !== 'souris') return;
            if (e.detail === 0) return; // clic provoqué par le clavier : ignoré
            incrementer(e.clientX, e.clientY, e.isTrusted);
        });

        document.addEventListener('keydown', (e) => {
            if (mode !== 'clavier') return;
            if (e.target === menuMode || e.target === menuDuree || e.target === menuChrono) return;
            if (e.target.closest && e.target.closest('.menu-gauche')) return;   // ne pas gêner le menu de gauche
            if (e.repeat) return;
            if (e.code === 'Space' || e.key === 'Enter' || e.key === 'ArrowUp') {
                e.preventDefault();
                incrementer(undefined, undefined, e.isTrusted);
            }
        });

        boutonReset.addEventListener('click', () => {
            reinitialiser();
            boutonReset.blur(); // évite qu'Espace/Entrée relance le reset en mode clavier
        });

        // ----- Menu déroulant : test de réaction -----
        const menuGauche = document.getElementById('menu-gauche');
        const menuGaucheBouton = document.getElementById('menu-gauche-bouton');
        const menuGaucheContenu = document.getElementById('menu-gauche-contenu');
        const zoneReac = document.getElementById('zone-reaction');
        const reacTitre = document.getElementById('reac-titre');
        const reacSous = document.getElementById('reac-sous');
        const reacDernier = document.getElementById('reac-dernier');
        const reacRecord = document.getElementById('reac-record');

        let reacEtat = 'attente';   // 'attente' | 'rouge' | 'vert'
        let reacTimeout = null;
        let reacDebut = 0;

        function lireRecordReac() {
            try {
                return parseInt(localStorage.getItem('reaction-record'), 10) || 0;
            } catch (e) {
                return 0;
            }
        }

        function ecrireRecordReac(valeur) {
            try {
                localStorage.setItem('reaction-record', String(valeur));
            } catch (e) {}
        }

        function afficherRecordReac() {
            const r = lireRecordReac();
            reacRecord.textContent = r ? r + ' ms' : '-';
        }

        function reacAffichage(classe, titre, sous) {
            zoneReac.className = 'zone-reaction ' + classe;
            reacTitre.textContent = titre;
            reacSous.textContent = sous;
        }

        function reacCommencer() {
            reacEtat = 'rouge';
            reacAffichage('rouge', 'Attends le vert…', 'Ne clique pas encore !');
            const delai = 1500 + Math.random() * 3000; // entre 1,5 et 4,5 secondes
            reacTimeout = setTimeout(() => {
                reacEtat = 'vert';
                reacDebut = performance.now();
                reacAffichage('vert', 'CLIQUE !', '');
            }, delai);
        }

        zoneReac.addEventListener('pointerdown', (e) => {
            if (!e.isTrusted) return;

            if (reacEtat === 'attente') {
                reacCommencer();
            } else if (reacEtat === 'rouge') {
                // Clic trop tôt
                clearTimeout(reacTimeout);
                reacEtat = 'attente';
                reacAffichage('trop-tot', 'Trop tôt !', 'Clique pour réessayer');
            } else if (reacEtat === 'vert') {
                const temps = Math.round(performance.now() - reacDebut);
                reacEtat = 'attente';
                reacDernier.textContent = temps + ' ms';

                let sous = 'Clique pour rejouer';
                const ancien = lireRecordReac();
                if (ancien === 0 || temps < ancien) {
                    ecrireRecordReac(temps);
                    afficherRecordReac();
                    sous = '🏆 Nouveau record ! Clique pour rejouer';
                }
                reacAffichage('resultat', temps + ' ms', sous);
            }
        });

        menuGaucheBouton.addEventListener('click', () => {
            const ouvrir = menuGaucheContenu.style.display === 'none';
            menuGaucheContenu.style.display = ouvrir ? '' : 'none';
            menuGauche.classList.toggle('ouvert', ouvrir);
            menuGaucheBouton.setAttribute('aria-expanded', String(ouvrir));

            if (!ouvrir) {
                // En fermant le menu, on annule un test en cours
                clearTimeout(reacTimeout);
                reacEtat = 'attente';
                reacAffichage('attente', 'Clique pour commencer', 'Clique dès que la zone devient verte !');
            }
        });

        afficherRecordReac();

        // ----- Initialisation -----
        appliquerMode();
        reinitialiser();
    </script>

    <!-- Statistiques de visites (GoatCounter) -->
    <script data-goatcounter="https://yutaa.goatcounter.com/count"
            async src="https://gc.zgo.at/count.js"></script>

</body>
